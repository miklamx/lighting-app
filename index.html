<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTI-FAMILY LIGHTING | PROPERTY LIGHTING ASSESSMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* NASCAR Inspired Palette */
            --bg-asphalt: #050505;
            --bg-cockpit: #111111;
            --velocity-yellow: #FFD700;
            --caution-red: #FF0000;
            --green-flag: #00FF00;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
            --border-hard: #333333;
        }

        body {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            background-color: var(--bg-asphalt);
            background-image: 
                linear-gradient(45deg, rgba(20,20,20,0.5) 25%, transparent 25%), 
                linear-gradient(-45deg, rgba(20,20,20,0.5) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(20,20,20,0.5) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(20,20,20,0.5) 75%);
            background-size: 10px 10px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--velocity-yellow);
            padding-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .sub-header {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: -10px;
            margin-bottom: 20px;
            font-family: 'Roboto Mono', monospace;
            text-transform: none;
        }

        .main-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 15px;
        }

        @media (max-width: 1000px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--bg-cockpit);
            border: 2px solid var(--border-hard);
            border-radius: 0;
            padding: 15px;
            position: relative;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            border-style: solid;
            border-width: 0 15px 15px 0;
            border-color: transparent var(--border-hard) transparent transparent;
        }

        .site-map-container {
            margin-bottom: 15px;
            border: 2px solid var(--velocity-yellow);
            padding: 5px;
        }

        .site-map-svg {
            width: 100%;
            height: auto;
            background-color: #000000;
        }

        .map-zone {
            cursor: pointer;
            fill-opacity: 0.1;
            stroke-width: 2;
            transition: all 0.15s ease-out;
        }

        .map-zone:hover, .map-zone.active {
            fill-opacity: 0.9;
            stroke-width: 4;
            stroke: #FFFFFF;
        }

        .zone-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .zone-item {
            padding: 10px;
            cursor: pointer;
            margin-bottom: 5px;
            background-color: #000000;
            border: 1px solid var(--border-hard);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.1s ease-out;
        }

        .zone-item:hover {
            border-color: var(--velocity-yellow);
        }

        .zone-item.active {
            border: 2px solid var(--velocity-yellow);
            background-color: rgba(255, 215, 0, 0.1);
        }

        .zone-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .badge {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.75rem;
            padding: 2px 6px;
            background-color: var(--border-hard);
            color: var(--text-muted);
        }

        .zone-item.active .badge {
            background-color: var(--velocity-yellow);
            color: #000000;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .spec-box {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border: 1px solid var(--border-hard);
            border-left: 4px solid var(--border-hard);
        }

        .spec-box.light-level { border-left-color: #FFFFFF; }
        .spec-box.optic { border-left-color: var(--velocity-yellow); }
        .spec-box.control { border-left-color: var(--caution-red); }
        .spec-box.dlc { border-left-color: var(--green-flag); }

        .spec-box label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 2px;
            font-family: 'Roboto Mono', monospace;
        }

        .spec-box span {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .calculator-panel {
            border: 2px solid var(--green-flag);
            padding: 15px;
            margin-top: 15px;
            background-color: #000000;
        }

        .calculator-panel h3 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--green-flag);
            margin-bottom: 10px;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        @media (max-width: 600px) {
            .calc-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Roboto Mono', monospace;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            background-color: #111111;
            border: 1px solid var(--border-hard);
            color: var(--text-main);
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
            box-sizing: border-box;
            border-radius: 0;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--velocity-yellow);
        }

        .roi-summary {
            margin-top: 15px;
            padding: 10px;
            background-color: #000000;
            border: 2px solid var(--green-flag);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            text-align: center;
        }

        .roi-stat label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: 'Roboto Mono', monospace;
        }

        .roi-stat span {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--green-flag);
            font-family: 'Roboto Mono', monospace;
        }

        .notes-panel {
            margin-top: 15px;
            border: 1px solid var(--border-hard);
            padding: 12px;
            background-color: #000000;
        }

        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .chip-btn {
            background-color: #111111;
            color: var(--velocity-yellow);
            border: 1px solid var(--velocity-yellow);
            padding: 6px 10px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        .chip-btn:hover {
            background-color: var(--velocity-yellow);
            color: #000000;
            font-weight: bold;
        }

        .btn-clear {
            background-color: transparent;
            color: var(--caution-red);
            border: 1px solid var(--caution-red);
            padding: 4px 8px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            margin-left: auto;
        }

        .btn-clear:hover {
            background-color: var(--caution-red);
            color: #FFFFFF;
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .btn-action {
            background-color: var(--velocity-yellow);
            color: #000000;
            border: none;
            padding: 15px 20px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: background-color 0.1s ease;
        }

        .btn-action:hover {
            background-color: #FFFFFF;
            background-image: linear-gradient(45deg, #000 25%, transparent 25%, transparent 50%, #000 50%, #000 75%, transparent 75%, transparent);
            background-size: 20px 20px;
            color: var(--velocity-yellow);
        }

        .output-box {
            margin-top: 15px;
            background-color: #000000;
            border: 1px solid var(--border-hard);
            padding: 10px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.8rem;
            color: var(--velocity-yellow);
            white-space: pre-wrap;
            display: none;
        }
    </style>
</head>
<body>

<header>
    <h1>PROPERTY LIGHTING ASSESSMENT</h1>
</header>
<div class="sub-header">Field audit tool for multi-family exterior lighting retrofits. Select zone to configure.</div>

<div class="main-container">
    <div class="panel">
        <div class="site-map-container">
            <svg class="site-map-svg" viewBox="0 0 400 260">
                <rect id="svg-parking" class="map-zone" x="20" y="20" width="220" height="110" fill="#FFD700" stroke="#FFD700" onclick="selectZoneById('parking')"/>
                <text x="130" y="75" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle" pointer-events="none">PARKING</text>
                
                <rect id="svg-perimeter-parking" class="map-zone" x="250" y="20" width="130" height="110" fill="#FF0000" stroke="#FF0000" onclick="selectZoneById('perimeter-parking')"/>
                <text x="315" y="75" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" pointer-events="none">PERIMETER</text>

                <rect id="svg-breezeways" class="map-zone" x="20" y="140" width="160" height="100" fill="#FFFFFF" stroke="#FFFFFF" onclick="selectZoneById('breezeways')"/>
                <text x="100" y="195" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle" pointer-events="none">UNITS / WALK</text>

                <rect id="svg-stairwells" class="map-zone" x="190" y="140" width="80" height="100" fill="#0000FF" stroke="#0000FF" onclick="selectZoneById('stairwells')"/>
                <text x="230" y="195" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" pointer-events="none">STAIRS</text>

                <rect id="svg-perimeter-bldg" class="map-zone" x="280" y="140" width="100" height="100" fill="#00FF00" stroke="#00FF00" onclick="selectZoneById('perimeter-bldg')"/>
                <text x="330" y="195" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" pointer-events="none">WALL PACKS</text>
            </svg>
        </div>

        <ul class="zone-list" id="zoneList"></ul>
    </div>

    <div class="panel" id="detailCard">
        </div>
</div>

<script>
    const zoneData = [
        { 
            id: "parking", 
            title: "MAIN PARKING LOT", 
            fc: "1.0 - 2.0 FC AVG", 
            optics: "TYPE III / TYPE V", 
            controls: "BI-LEVEL DIM (50%) + PC", 
            fixtures: "POLE-MOUNT AREA LIGHTS", 
            dlcTier: "DLC PREMIUM V5.1", 
            baseWattage: 250, 
            ledWattage: 75, 
            estRebatePerFixture: 75,
            quickChips: ["20ft Pole", "25ft Pole", "2-3/8 Tenon", "4in Tenon", "Square Pole", "Round Pole", "Rust Present", "Needs Bullhorn"]
        },
        { 
            id: "perimeter-parking", 
            title: "PERIMETER LINE", 
            fc: "1.0 - 1.5 FC AVG", 
            optics: "TYPE IV FWD THROW", 
            controls: "BI-LEVEL DIM + PC", 
            fixtures: "FULL-CUTOFF W/ SHIELDS", 
            dlcTier: "DLC PREMIUM V5.1", 
            baseWattage: 250, 
            ledWattage: 80, 
            estRebatePerFixture: 75,
            quickChips: ["House-Side Shield Req", "Property Line Adjacent", "20ft Pole", "Zero Spill Mandate", "Single Arm Mount"]
        },
        { 
            id: "breezeways", 
            title: "BREEZEWAYS / WALK", 
            fc: "3.0 - 5.0 FC AVG", 
            optics: "WIDE SURFACE", 
            controls: "BI-LEVEL MOTION + PC", 
            fixtures: "CEILING PUCK / CANOPY", 
            dlcTier: "DLC STANDARD V5.1", 
            baseWattage: 70, 
            ledWattage: 20, 
            estRebatePerFixture: 25,
            quickChips: ["Concrete Ceiling", "Soffit Mount", "J-Box Existing", "Low Clearance", "8ft Height", "10ft Height"]
        },
        { 
            id: "stairwells", 
            title: "STAIRWELL EGRESS", 
            fc: "5.0 - 10.0 FC MIN", 
            optics: "WIDE SYMMETRIC", 
            controls: "24/7 + EM BACKUP", 
            fixtures: "VANDAL-RESISTANT WALL", 
            dlcTier: "DLC STANDARD V5.1", 
            baseWattage: 100, 
            ledWattage: 30, 
            estRebatePerFixture: 35,
            quickChips: ["EM Battery Backup Req", "Vandal Lens Req", "Steel Frame", "Concrete Wall", "Continuous Operation"]
        },
        { 
            id: "perimeter-bldg", 
            title: "BUILDING WALL PACKS", 
            fc: "1.5 - 3.0 FC AVG", 
            optics: "TYPE III / FWD THROW", 
            controls: "INTEGRATED MOTION (30%)", 
            fixtures: "FULL-CUTOFF ARCH LED", 
            dlcTier: "DLC PREMIUM V5.1", 
            baseWattage: 175, 
            ledWattage: 45, 
            estRebatePerFixture: 50,
            quickChips: ["Brick Mount", "Stucco / EIFS Mount", "Wood Siding", "Covers Footprint", "12ft Mounting Ht", "15ft Mounting Ht"]
        }
    ];

    let currentZone = zoneData[0];
    let auditData = {};

    function init() {
        zoneData.forEach(z => {
            auditData[z.id] = { qty: 0, notes: "" };
        });
        renderZoneList();
        renderDetailCard();
    }

    function selectZoneById(id) {
        const found = zoneData.find(z => z.id === id);
        if (found) {
            currentZone = found;
            renderZoneList();
            renderDetailCard();
        }
    }

    function renderZoneList() {
        const listEl = document.getElementById("zoneList");
        listEl.innerHTML = "";
        zoneData.forEach(zone => {
            const li = document.createElement("li");
            li.className = `zone-item ${zone.id === currentZone.id ? 'active' : ''}`;
            const qty = auditData[zone.id].qty;
            li.innerHTML = `
                <span class="zone-title">${zone.title}</span>
                <span class="badge">${qty > 0 ? qty + ' UNITS' : 'PENDING'}</span>
            `;
            li.onclick = () => selectZoneById(zone.id);
            listEl.appendChild(li);

            const svgEl = document.getElementById(`svg-${zone.id}`);
            if (svgEl) {
                if (zone.id === currentZone.id) {
                    svgEl.classList.add('active');
                } else {
                    svgEl.classList.remove('active');
                }
            }
        });
    }

    function renderDetailCard() {
        const cardEl = document.getElementById("detailCard");
        const currentAudit = auditData[currentZone.id];

        const chipsHtml = currentZone.quickChips.map(chip => 
            `<button class="chip-btn" onclick="addChipNote('${chip}')">+ ${chip}</button>`
        ).join('');

        cardEl.innerHTML = `
            <h2>TELEMETRY: ${currentZone.title}</h2>
            
            <div class="spec-grid">
                <div class="spec-box light-level">
                    <label>TARGET LIGHT LEVEL</label>
                    <span>${currentZone.fc}</span>
                </div>
                <div class="spec-box optic">
                    <label>OPTIC DISTRIBUTION</label>
                    <span>${currentZone.optics}</span>
                </div>
                <div class="spec-box control">
                    <label>MANDATORY CONTROLS</label>
                    <span>${currentZone.controls}</span>
                </div>
                <div class="spec-box dlc">
                    <label>REBATE ELIGIBILITY</label>
                    <span>${currentZone.dlcTier}</span>
                </div>
            </div>

            <div class="calculator-panel">
                <h3>PERFORMANCE CALCULATOR [ENERGY + INCENTIVE]</h3>
                <div class="calc-grid">
                    <div class="form-group">
                        <label>FIXTURE QTY</label>
                        <input type="number" id="inputQty" value="${currentAudit.qty}" min="0" oninput="updateCalculations()"/>
                    </div>
                    <div class="form-group">
                        <label>BASELINE (W)</label>
                        <input type="number" id="inputBaseW" value="${currentZone.baseWattage}" oninput="updateCalculations()"/>
                    </div>
                    <div class="form-group">
                        <label>LED (W)</label>
                        <input type="number" id="inputLedW" value="${currentZone.ledWattage}" oninput="updateCalculations()"/>
                    </div>
                    <div class="form-group">
                        <label>REBATE/UNIT ($)</label>
                        <input type="number" id="inputRebate" value="${currentZone.estRebatePerFixture}" oninput="updateCalculations()"/>
                    </div>
                </div>

                <div class="roi-summary">
                    <div class="roi-stat">
                        <label>POWER REDUCTION</label>
                        <span id="summaryKw">0.0 KW</span>
                    </div>
                    <div class="roi-stat">
                        <label>EST. INCENTIVE</label>
                        <span id="summaryRebate">$0</span>
                    </div>
                </div>
            </div>

            <div class="notes-panel">
                <div class="notes-header">
                    <label style="font-family: 'Roboto Mono', monospace; font-size: 0.75rem; color: var(--text-muted);">INTERACTIVE FIELD NOTES & SPECS</label>
                    <button class="btn-clear" onclick="clearNotes()">CLEAR NOTES</button>
                </div>
                
                <div class="chip-container">
                    ${chipsHtml}
                </div>

                <div class="form-group">
                    <textarea id="fieldNotes" rows="3" placeholder="Tap chips above or type custom field notes..." onchange="saveNotes()">${currentAudit.notes}</textarea>
                </div>
            </div>

            <button class="btn-action" onclick="generateTransmittal()">EXPORT FACTORY SPEC PACKAGE</button>
            <div id="outputBox" class="output-box"></div>
        `;

        updateCalculations();
    }

    function addChipNote(text) {
        const textarea = document.getElementById("fieldNotes");
        let currentText = textarea.value.trim();
        
        if (currentText.includes(text)) return;
        
        if (currentText.length > 0) {
            textarea.value = currentText + " | " + text;
        } else {
            textarea.value = text;
        }
        
        saveNotes();
    }

    function clearNotes() {
        const textarea = document.getElementById("fieldNotes");
        textarea.value = "";
        saveNotes();
    }

    function updateCalculations() {
        const qty = parseInt(document.getElementById("inputQty").value) || 0;
        const baseW = parseFloat(document.getElementById("inputBaseW").value) || 0;
        const ledW = parseFloat(document.getElementById("inputLedW").value) || 0;
        const rebatePerUnit = parseFloat(document.getElementById("inputRebate").value) || 0;

        auditData[currentZone.id].qty = qty;

        const totalKwSaved = ((baseW - ledW) * qty) / 1000;
        const totalRebate = qty * rebatePerUnit;

        document.getElementById("summaryKw").innerText = `${totalKwSaved.toFixed(1)} KW`;
        document.getElementById("summaryRebate").innerText = `$${totalRebate.toLocaleString()}`;

        renderZoneList();
    }

    function saveNotes() {
        const notes = document.getElementById("fieldNotes").value;
        auditData[currentZone.id].notes = notes;
    }

    function generateTransmittal() {
        saveNotes();
        const activeZones = zoneData.map(z => ({
            segment: z.title,
            targetFC: z.fc,
            distribution: z.optics,
            mandatoryControls: z.controls,
            dlcRequirement: z.dlcTier,
            quantity: auditData[z.id].qty,
            fieldNotes: auditData[z.id].notes
        })).filter(z => z.quantity > 0);

        if (activeZones.length === 0) {
            alert("NO DATA: ENTER QUANTITIES FOR AT LEAST ONE ZONE.");
            return;
        }

        const payload = {
            project: "MULTI-FAMILY EXTERIOR | FACTORY RFQ PACKAGE",
            generatedAt: new Date().toISOString(),
            zones: activeZones
        };

        const outputEl = document.getElementById("outputBox");
        outputEl.style.display = "block";
        outputEl.innerText = JSON.stringify(payload, null, 2);
    }

    init();
</script>

</body>
</html>
